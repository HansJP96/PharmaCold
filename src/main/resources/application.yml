spring:
  application:
    name: pharmacold-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
  security:
    secret: ${JWT_SECRET:local-development-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
    token-ttl: ${JWT_TTL_MINUTES:15}
    issuer: ${JWT_ISSUER:pharmacold-security}

retry:
  notifications:
    delay: 1000
    multiplier: 2
    maxAttempts: 3
    maxDelay: 8000

api-clients:
  fleet:
    webhook:
      base-url: "https://fleet.logistics.com/api/v1"
      connect-timeout-ms: 2000
      read-timeout-ms: 4000
