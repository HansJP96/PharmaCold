default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--force-scope, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # (Opcional) Utilidades de limpieza de código general
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace   # Elimina espacios en blanco innecesarios al final de línea
      - id: end-of-file-fixer     # Asegura que cada archivo termine con salto de línea
      - id: check-yaml            # Valida sintaxis YAML (Spring configs, etc.)
